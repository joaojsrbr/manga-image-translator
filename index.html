<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manga AI Reader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        bg: '#050505', surface: '#0f0f0f', border: '#27272a',
                        primary: '#8b5cf6', primaryHover: '#7c3aed', accent: '#a78bfa',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-bg text-zinc-300 h-screen overflow-hidden flex text-sm antialiased selection:bg-primary selection:text-white">

    <div id="toast-container" class="fixed top-6 right-6 z-50 flex flex-col gap-3 pointer-events-none"></div>

    <aside class="w-72 bg-surface/80 backdrop-blur-xl border-r border-border flex flex-col h-full shrink-0 relative z-20">
        
        <div class="h-14 flex items-center px-5 border-b border-border">
            <div class="flex items-center gap-2.5">
                <div class="w-6 h-6 rounded bg-gradient-to-br from-primary to-blue-600 flex items-center justify-center text-xs text-white font-bold shadow-lg shadow-primary/20">M</div>
                <span class="font-semibold text-white tracking-tight">Manga AI</span>
                <span class="text-[10px] bg-zinc-800 text-zinc-400 px-1.5 py-0.5 rounded border border-zinc-700 ml-1">v2.1</span>
            </div>
        </div>

        <div class="p-4 border-b border-border bg-zinc-900/30">
            <div class="space-y-3">
                <div class="flex justify-between items-center">
                    <label class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest">Adicionar</label>
                    <span id="loading-indicator" class="text-[10px] text-primary hidden animate-pulse font-medium">Processando...</span>
                </div>

                <div class="relative group">
                    <input type="text" id="url" placeholder="Cole a URL do capítulo..." oninput="autoPreencher()" 
                        class="w-full bg-zinc-800/50 border border-zinc-700 rounded-md py-2 pl-3 pr-8 text-xs text-white placeholder-zinc-600 focus:border-primary focus:ring-1 focus:ring-primary focus:bg-zinc-800 outline-none transition-all">
                    <div class="absolute right-2 top-2 text-zinc-600">🔗</div>
                </div>

                <input type="text" id="selector" value="#readerarea img" placeholder="Seletor CSS" 
                    class="w-full bg-transparent border-b border-zinc-800 py-1 px-1 text-[10px] text-zinc-500 focus:text-zinc-300 focus:border-zinc-600 outline-none transition-colors"
                    title="Seletor CSS (Opcional)">

                <div class="flex gap-2">
                    <input type="text" id="siteName" placeholder="Nome da Obra" class="w-1/2 bg-zinc-800/50 border border-zinc-700 rounded-md py-1.5 px-3 text-xs text-white focus:border-primary outline-none transition-all">
                    <input type="text" id="chapterName" placeholder="Cap." class="w-14 bg-zinc-800/50 border border-zinc-700 rounded-md py-1.5 px-3 text-xs text-white focus:border-primary outline-none transition-all text-center">
                </div>

                <div class="relative">
                    <input type="text" id="translatorType" value="gemini" placeholder="Motor (ex: gemini, google)" 
                        class="w-full bg-zinc-800/50 border border-zinc-700 rounded-md py-1.5 px-3 text-xs text-white focus:border-primary outline-none transition-all"
                        title="Motor de Tradução (gemini, google, etc)">
                    <div class="absolute right-2 top-2 text-[10px] text-zinc-600 pointer-events-none">ENGINE</div>
                </div>
                
                <button onclick="baixarCapitulo()" id="btnDownload"
                    class="w-full bg-white text-black hover:bg-zinc-200 font-medium py-2 rounded-md text-xs transition-all shadow active:scale-95 flex justify-center items-center gap-2">
                    <span>Baixar Imagens</span>
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>
                </button>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto p-3">
            <div class="flex justify-between items-center mb-3 px-1">
                <h2 class="text-[10px] font-bold uppercase text-zinc-500 tracking-widest">Sua Biblioteca</h2>
                <button onclick="carregarBiblioteca()" class="text-zinc-500 hover:text-white transition p-1 rounded hover:bg-zinc-800">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                </button>
            </div>
            
            <div id="libraryList" class="space-y-1"></div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-full relative bg-bg">
        <header class="absolute top-0 left-0 right-0 h-14 bg-bg/80 backdrop-blur-md border-b border-border flex justify-between items-center px-6 z-30 transition-all duration-300">
            <div class="flex flex-col justify-center">
                <h2 id="currentTitle" class="text-sm font-medium text-white tracking-wide truncate max-w-2xl">Selecione uma obra</h2>
                <div id="currentStatus" class="flex items-center gap-2 h-4"><span class="text-[10px] text-zinc-500">Pronto para ler</span></div>
            </div>
            <div class="flex items-center gap-3">
                <div class="text-[10px] text-zinc-600 border border-zinc-800 rounded px-2 py-1 bg-zinc-900 hidden md:block">Pressione <kbd class="font-sans text-zinc-400 font-bold">/</kbd> para focar na URL</div>
            </div>
        </header>

        <div id="imageContainer" class="flex-1 overflow-y-auto pt-20 pb-10 px-4 md:px-0 text-center scroll-smooth">
            <div class="flex flex-col items-center justify-center h-full text-zinc-700 gap-4 opacity-50">
                <svg class="w-16 h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                <p class="text-sm font-light">Sua biblioteca está à esquerda.</p>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
